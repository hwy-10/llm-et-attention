<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="Malgun Gothic, Segoe UI, sans-serif">
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="80" y="92" font-size="42" font-weight="700" fill="#16181d">같은 조건에서 네 가지를 구현해 비교한다</text>
  <text x="80" y="132" font-size="22" fill="#565e6b">②와 ③의 비교가 승부처 — 순차 처리로 치른 비용을 종단 이득이 넘어서는가</text>
  <line x1="80" y1="162" x2="1200" y2="162" stroke="#d4dae3" stroke-width="1.5"/>

  <!-- column headers -->
  <text x="352"  y="222" font-size="19" font-weight="700" fill="#565e6b" text-anchor="middle">비트평면 읽기</text>
  <text x="576"  y="222" font-size="19" font-weight="700" fill="#565e6b" text-anchor="middle">부분 내적</text>
  <text x="800"  y="222" font-size="19" font-weight="700" fill="#565e6b" text-anchor="middle">시프트 누산</text>
  <text x="1024" y="222" font-size="19" font-weight="700" fill="#565e6b" text-anchor="middle">종단 판정</text>

  <!-- ① baseline -->
  <text x="80" y="286" font-size="26" font-weight="700" fill="#16181d">①</text>
  <text x="116" y="286" font-size="22" font-weight="700" fill="#16181d">기준선</text>
  <rect x="240" y="256" width="896" height="56" rx="8" fill="#f8eeda" stroke="#a5620c" stroke-width="2"/>
  <text x="268" y="290" font-size="21" font-weight="700" fill="#16181d">병렬 INT8 곱셈 누산 — 다른 데이터패스 · DSP 사용 · 사이클 1/8</text>

  <!-- ② seq -->
  <text x="80" y="368" font-size="26" font-weight="700" fill="#16181d">②</text>
  <text x="116" y="368" font-size="22" font-weight="700" fill="#16181d">순차</text>
  <rect x="240" y="338" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="464" y="338" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="688" y="338" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <text x="936" y="374" font-size="19" fill="#565e6b">종단 없음</text>

  <!-- ③ exact -->
  <text x="80" y="450" font-size="26" font-weight="700" fill="#1b6ed0">③</text>
  <text x="116" y="450" font-size="22" font-weight="700" fill="#1b6ed0">정확</text>
  <rect x="240" y="420" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="464" y="420" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="688" y="420" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="912" y="420" width="224" height="56" rx="8" fill="#dfeafa" stroke="#1b6ed0" stroke-width="2.4"/>
  <text x="1024" y="455" font-size="20" font-weight="700" fill="#1b6ed0" text-anchor="middle">margin = 0</text>

  <!-- ④ approx -->
  <text x="80" y="532" font-size="26" font-weight="700" fill="#c8392b">④</text>
  <text x="116" y="532" font-size="22" font-weight="700" fill="#c8392b">근사</text>
  <rect x="240" y="502" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="464" y="502" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="688" y="502" width="224" height="56" rx="8" fill="#eef1f6" stroke="#98a0ac" stroke-width="2"/>
  <rect x="912" y="502" width="224" height="56" rx="8" fill="#fbe6e3" stroke="#c8392b" stroke-width="2.4"/>
  <text x="1024" y="537" font-size="20" font-weight="700" fill="#c8392b" text-anchor="middle">margin &gt; 0</text>

  <!-- verdict strip -->
  <rect x="240" y="592" width="448" height="88" rx="6" fill="#dfeafa" stroke="#1b6ed0" stroke-width="1.8"/>
  <text x="268" y="626" font-size="21" font-weight="700" fill="#16181d">① = ② = ③ 점수 완전 동일</text>
  <text x="268" y="656" font-size="18" fill="#565e6b">③ 은 손실 없는 판정 — top-k 를 잃지 않는다</text>

  <rect x="712" y="592" width="424" height="88" rx="6" fill="#fbe6e3" stroke="#c8392b" stroke-width="1.8"/>
  <text x="740" y="626" font-size="21" font-weight="700" fill="#16181d">④ 만 정확도를 내준다</text>
  <text x="740" y="656" font-size="18" fill="#565e6b">여유값을 키운 만큼 더 많이 중단된다</text>
</svg>
