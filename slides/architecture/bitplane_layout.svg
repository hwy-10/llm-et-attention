  <!-- ================= 결론 ================= -->
  <line x1="80" y1="688" x2="1200" y2="688" stroke="#d4dae3" stroke-width="1.5"/>
  <text x="80" y="712" font-size="19" font-weight="700" fill="#16181d">→ 상위 자리만 선택적으로 읽는 것이 물리적으로 가능해진다. 조기 종단이 절감으로 이어지는 전제다.</text>
