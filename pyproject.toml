[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-et-attention"
version = "0.1.0"
description = "MSB-first bit-plane attention with early termination: algorithm-level verification toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

# 코어 시뮬레이터는 numpy만 있으면 동작한다.
# 아래는 전부 선택 의존성이며, 없으면 해당 기능만 건너뛴다.
[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
table = ["pandas>=2.0"]
config = ["PyYAML>=6.0"]
model = ["torch>=2.0", "transformers>=4.40", "datasets>=2.18"]
dev = ["pytest>=7.4"]
all = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "pytest>=7.4",
]

[tool.setuptools]
packages = ["src", "utils", "utils.visualization_example", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
