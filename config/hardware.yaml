# ===========================================================================
# ★ RTL/FPGA 팀 ↔ 소프트웨어 팀 인터페이스 파일 ★
#
# 소프트웨어는 이 파일의 숫자만 읽어 사이클/읽기/자원을 추정하고,
# RTL 실측이 나오면 utils/crosscheck.py 가 예측과 실측을 대조한다.
# 덕분에 RTL 이 완성되기 전에도 알고리즘 검증이 끝까지 진행된다.
#
# ▶ 모든 값에 source 필드가 붙는다. 반드시 채울 것.
#     vivado_synth  : 합성 보고서 실측
#     rtl_sim       : 시뮬레이션 실측
#     datasheet     : FPGA 데이터시트
#     estimate      : 추정치 (논문에 그대로 쓰면 안 됨)
# ===========================================================================

meta:
  revision: 0
  updated: "2026-08-14"
  fpga_part: "xc7z020clg400-1"      # 예시. 실제 타겟으로 교체할 것
  note: "RTL 실측 전 placeholder"

# ---------------------------------------------------------------------------
# 비트평면 BRAM 구성  ★ 메모리 읽기 절감의 실현 여부를 결정하는 부분 ★
# ---------------------------------------------------------------------------
memory:
  # 한 BRAM 워드에 몇 개 토큰의 같은 평면 비트가 들어가는가.
  # ★ 종단된 토큰이 흩어져 있으면, 워드 안에 살아있는 토큰이 하나라도 있는 한
  #   워드 전체를 읽어야 한다 -> 이론적 절감과 실현 절감이 벌어진다.
  #   이것이 schedule.py 의 work-compaction 이 필요한 진짜 이유다.
  word_tokens: 32
  word_bits: 32
  n_bram_ports: 2
  # 평면 m 의 종단 판정이 나오기까지의 지연(평면 수).
  # 이 값이 0이면 읽기 절감이 과대평가된다. 실제 파이프라인 깊이를 넣을 것.
  decision_latency_planes: 1
  source: "estimate"

# ---------------------------------------------------------------------------
# 데이터패스 병렬도
# ---------------------------------------------------------------------------
datapath:
  lanes: 32                 # 제안 설계: 한 사이클에 처리하는 토큰 수 (평면 1개 기준)
  adder_tree_width: 64      # = head_dim. 부분 내적 가산 트리 입력 수
  baseline_pe: 32           # 기준 설계(①)의 INT8 MAC PE 개수
  baseline_cycles_per_token: 1
  source: "estimate"

# ---------------------------------------------------------------------------
# 자원 / 주파수  ← Vivado 합성 보고서에서 채운다 (utils/hw_parser.py)
#   손익분기(가이드 6.3-(4)) 계산에 쓰인다:
#     실효 speedup = (cycles_① / cycles_③) x (fmax_③ / fmax_①)
# ---------------------------------------------------------------------------
resources:
  baseline:
    lut: 8200
    ff: 5100
    dsp: 32
    bram36: 16
    fmax_mhz: 200.0
    dynamic_power_mw: 210.0
    source: "estimate"
  seq_no_et:              # 설계 ② 비트평면 순차, 종단 없음
    lut: 11800
    ff: 6400
    dsp: 0
    bram36: 16
    fmax_mhz: 185.0
    dynamic_power_mw: 175.0
    source: "estimate"
  exact_et:               # 설계 ③ 정확 모드 종단
    lut: 15600
    ff: 8900
    dsp: 0
    bram36: 16
    fmax_mhz: 165.0
    dynamic_power_mw: 168.0
    source: "estimate"
  approx_et:              # 설계 ④ 근사 모드 종단
    lut: 16900
    ff: 9400
    dsp: 0
    bram36: 16
    fmax_mhz: 160.0
    dynamic_power_mw: 162.0
    source: "estimate"

# ---------------------------------------------------------------------------
# 종단 불규칙성 처리 (가이드 6.3-(2))
# ---------------------------------------------------------------------------
schedule:
  batch_size: 32            # "일괄 처리" 정책의 묶음 크기
  two_phase_split: 3        # "2단계 처리": 1단계에서 스캔할 평면 수
  compaction_cost_cycles: 2 # 작업 압축의 사이클 오버헤드 (평면당)
  source: "estimate"
