# ===========================================================================
# ★ RTL/FPGA 팀 ↔ 소프트웨어 팀 인터페이스 파일 ★
#
# 소프트웨어는 이 파일의 숫자만 읽어 사이클/읽기/자원을 추정하고,
# RTL 실측이 나오면 utils/crosscheck.py 가 예측과 실측을 대조한다.
# 덕분에 RTL 이 완성되기 전에도 알고리즘 검증이 끝까지 진행된다.
#
# ▶ 모든 값에 source 필드가 붙는다. 반드시 채울 것.
#     vivado_synth  : 합성 보고서 실측
#     rtl_sim       : 시뮬레이션 실측
#     datasheet     : FPGA 데이터시트
#     estimate      : 추정치 (논문에 그대로 쓰면 안 됨)
# ===========================================================================

meta:
  revision: 0
  updated: "2026-08-14"
  fpga_part: "xc7z020clg400-1"      # 예시. 실제 타겟으로 교체할 것
  note: "RTL 실측 전 placeholder"

# ---------------------------------------------------------------------------
# 비트평면 BRAM 구성  ★ 메모리 읽기 절감의 실현 여부를 결정하는 부분 ★
# ---------------------------------------------------------------------------
memory:
  # 한 BRAM 워드에 몇 개 토큰의 같은 평면 비트가 들어가는가.
  # ★ 종단된 토큰이 흩어져 있으면, 워드 안에 살아있는 토큰이 하나라도 있는 한
  #   워드 전체를 읽어야 한다 -> 이론적 절감과 실현 절감이 벌어진다.
  #   이것이 schedule.py 의 work-compaction 이 필요한 진짜 이유다.
  # ★ 2026-08-28 확정: WORD_TOKENS = 1 (ARCHITECTURE.md 4.1.1)
  #   워드 = 토큰 1개의 한 평면 = head_dim 비트.
  #   단위 32 와 BRAM 개수가 거의 같은데(32개 vs 29개) 압축 회로가 주소 생성에 흡수된다.
  word_tokens: 1
  word_bits: 64            # = head_dim. 토큰 1개의 평면 하나
  # ★ 포트 수는 워드폭과 함께 움직여야 한다 (2026-08-29 병합에서 발견).
  #   한 사이클에 lanes 개 토큰을 먹이려면 lanes x head_dim 비트가 필요하다.
  #   워드가 좁아진 만큼 포트가 늘어야 대역폭이 유지된다.
  #     word_tokens=1,  n_ports=2   -> 메모리 376,650 vs 연산 33,043  (11배 병목)
  #     word_tokens=1,  n_ports=32  -> 메모리  23,761 vs 연산 33,043  (연산 병목)
  #     word_tokens=32, n_ports=2   -> 메모리  12,801 vs 연산 33,043  (연산 병목)
  #   조건은  word_tokens x n_ports >= lanes.
  #   docs/architecture.md §4.1.1 이 BRAM36 32개로 계산해 놓고 여기는 2 로 두어
  #   어긋나 있었다.
  n_bram_ports: 32
  # 평면 m 의 종단 판정이 나오기까지의 지연(평면 수).
  # 이 값이 0이면 읽기 절감이 과대평가된다. 실제 파이프라인 깊이를 넣을 것.
  decision_latency_planes: 1
  # ★★ 판정 지연은 상수가 아니다 — 2026-08-29 auto 로 확정 ★★
  #   ceil(pipeline_cycles / ceil(T / lanes)) 이므로 문맥 길이에 의존한다.
  #   평면 1장 처리에 ceil(T/lanes) 사이클이 걸리므로, 파이프라인 8사이클이
  #   몇 '평면' 인지는 T 가 정한다:
  #        T=32 -> 8평면 (종단 이득 0),  T=128 -> 2평면,  T>=256 -> 1평면
  #   디코드는 T 가 1 -> 512 로 자라므로 초반 스텝은 지연이 크다.
  #
  #   fixed = 위 상수를 그대로 사용. T >= 256 에서만 맞다. 기존 수치 재현용
  #   auto  = 스텝마다 T 로부터 계산   ★ 채택 — 이쪽이 물리적으로 맞다
  #
  #   대가: 절감 22.4% -> 20.5% (평균 지연 1.00 -> 1.61).
  #   부풀린 숫자를 버리고 방어 가능한 숫자를 쓴다.
  decision_latency_mode: "auto"
  pipeline_cycles: 8       # 가산트리 6단 + 마스킹 1 + 비교기 1
  source: "estimate"

# ---------------------------------------------------------------------------
# 출력 경로 (OUTPUT 단계)  ★ 팀 2 소유 — ARCHITECTURE.md 7.1
#   생존 집합을 (인덱스, 점수) 스트림으로 내보낸다. 개수가 가변이라 버퍼가 필요하다.
# ---------------------------------------------------------------------------
output:
  # ★★ 2026-08-29 정정: 별도 출력 버퍼를 두지 않는다 ★★
  #
  # 8/28 사양은 OUT_BUF = 2 x K_TOP = 32 이었다. "실측 최대 31, 초과 0회" 가 근거였는데
  # 출력 단계를 실제로 구현해 다시 재니 **시드에 따라 34 까지 나온다** (5개 시드 중 1개,
  # exact/margin=0/T=512). 32 로 두면 그 스텝은 무손실이 아니다.
  #
  # 그런데 애초에 버퍼가 필요 없다. 출력이 내보내는 (토큰 번호, 확정 점수) 는
  # 둘 다 데이터패스에 이미 있다:
  #     S_m 레지스터 파일  N_MAX x 22b   평면 루프 내내 T개를 들고 있어야 한다
  #     active 마스크      N_MAX x  1b   term_ctrl 이 종단 판정에 쓰는 그 비트
  # OUTPUT 은 active 를 훑으며 S_m 을 읽어 내보내면 된다. 새 저장소가 0 이다.
  #
  #     2 x K_TOP 버퍼안 :  +1,056b  + 부분정렬 회로  + 무손실 깨짐
  #     S_m 직접 스캔    :      +0b  + 스캔 카운터    + 무손실 보장
  #   버퍼를 따로 두는 쪽이 자원을 더 쓰면서 무손실을 깬다.
  #
  # 아래 값은 "여기서 자른다" 가 아니라 **넘으면 안 되는 상한(=N_MAX)** 이다.
  # 골든모델은 이걸 넘으면 CNT_TRUNC 를 올리므로, 0 이 유지되는지가 검증 항목이 된다.
  out_buf: 2048            # = N_MAX. 이론적 최악(활성 토큰 전체)을 그대로 담는다
  idx_bits: 11             # log2(N_MAX = 2048).  2026-08-29 N_MAX 확장에 맞춰 9 -> 11
  score_data_bits: 24      # ARCHITECTURE.md 3.1 비트폭 표
  source: "estimate"

# ---------------------------------------------------------------------------
# 데이터패스 병렬도
# ---------------------------------------------------------------------------
datapath:
  lanes: 32                 # 제안 설계: 한 사이클에 처리하는 토큰 수 (평면 1개 기준)
  adder_tree_width: 64      # = head_dim. 부분 내적 가산 트리 입력 수
  baseline_pe: 32           # 기준 설계(①)의 INT8 MAC PE 개수
  baseline_cycles_per_token: 1
  source: "estimate"

# ---------------------------------------------------------------------------
# 자원 / 주파수  ← Vivado 합성 보고서에서 채운다 (utils/hw_parser.py)
#   손익분기(가이드 6.3-(4)) 계산에 쓰인다:
#     실효 speedup = (cycles_① / cycles_③) x (fmax_③ / fmax_①)
# ---------------------------------------------------------------------------
resources:
  baseline:
    lut: 8200
    ff: 5100
    dsp: 32
    bram36: 32
    fmax_mhz: 200.0
    dynamic_power_mw: 210.0
    source: "estimate"
  seq_no_et:              # 설계 ② 비트평면 순차, 종단 없음
    lut: 11800
    ff: 6400
    dsp: 0
    bram36: 32
    fmax_mhz: 185.0
    dynamic_power_mw: 175.0
    source: "estimate"
  exact_et:               # 설계 ③ 정확 모드 종단
    lut: 15600
    ff: 8900
    dsp: 0
    bram36: 32
    fmax_mhz: 165.0
    dynamic_power_mw: 168.0
    source: "estimate"
  approx_et:              # 설계 ④ 근사 모드 종단
    lut: 16900
    ff: 9400
    dsp: 0
    bram36: 32
    fmax_mhz: 160.0
    dynamic_power_mw: 162.0
    source: "estimate"

# ---------------------------------------------------------------------------
# 종단 불규칙성 처리 (가이드 6.3-(2))
# ---------------------------------------------------------------------------
schedule:
  batch_size: 32            # "일괄 처리" 정책의 묶음 크기
  two_phase_split: 4        # ★ 확정: 생존 곡선상 평면 4부터 종단이 시작된다
  compaction_cost_cycles: 2 # 작업 압축의 사이클 오버헤드 (평면당)
  # ★ 연산과 BRAM 읽기가 겹치는가 ★
  #   true  : 완전 중첩 -> total = max(연산, 메모리)   낙관적
  #   false : 중첩 없음 -> total = 연산 + 메모리       보수적
  # 메모리 사이클은 ceil(words_bram / n_bram_ports) 로 계산한다.
  # 어느 쪽인지는 RTL 시뮬레이션으로 확정할 것 — 결론이 뒤집히는지 양쪽 다 볼 것.
  mem_overlap: true
  source: "estimate"
