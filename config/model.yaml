# ===========================================================================
# 모델 / 워크로드 스펙  — 배경지식 가이드 1.3, 3.5절
# 출처: Llama 3.2 1B (meta-llama/Llama-3.2-1B) config.json
# ===========================================================================

model:
  name: "Llama-3.2-1B"
  hf_id: "meta-llama/Llama-3.2-1B"
  n_layers: 16
  n_heads: 32
  n_kv_heads: 8
  head_dim: 64             # = d. 부분 내적의 누산 폭
  kv_dtype_bytes: 2        # FP16 (외부 KV 캐시 크기 계산용)
  source: "huggingface_config"

# ---------------------------------------------------------------------------
# 디코드 루프 설정  ★ 이 프로젝트는 고정 스냅샷이 아니라 루프를 돈다 ★
#   step s 에서 쿼리 q_s 는 토큰 0..s-1 을 본다 (causal).
#   T 가 자라면서 평균 종단 시점이 어떻게 변하는지가 핵심 관찰 대상.
# ---------------------------------------------------------------------------
decode:
  seq_len: 512             # 최종 캐시 길이 T_max
  warmup_tokens: 32        # prefill 로 이미 채워진 토큰 (여기부터 디코드 시작)
  step_stride: 1           # 1 = 모든 스텝 기록. 크게 하면 샘플링해서 빠르게.
  layer_idx: 8
  head_idx: 0

# 합성 데이터 (torch/transformers 없을 때) — 어텐션 sink 를 심어
# "소수 토큰이 softmax 를 지배한다"(가이드 4.1절)는 성질을 재현한다.
synthetic:
  enabled: true
  q_std: 1.0
  k_std: 1.0
  sink_frac: 0.04
  sink_gain: 3.5
  # 실제 어텐션 로짓의 표준편차 목표. 표준정규 q,k 를 그대로 쓰면 1 근처가 되어
  # softmax 가 거의 균등해지고 종단/근사 손실이 모두 비현실적으로 나온다.
  target_logit_std: 5.0
  source: "approximation"
