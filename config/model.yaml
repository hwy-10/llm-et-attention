# ===========================================================================
# 모델 / 워크로드 스펙  — 배경지식 가이드 1.3, 3.5절
# 출처: Llama 3.2 1B (meta-llama/Llama-3.2-1B) config.json
# ===========================================================================

model:
  name: "Llama-3.2-1B"
  # ★ 공식 저장소는 gated 라 라이선스 수락 + HF 토큰이 필요하다.
  #   unsloth/Llama-3.2-1B 는 동일 가중치의 비게이트 재배포본이며 config 가 일치한다
  #   (layers 16 / heads 32 / kv_heads 8 / head_dim 64). 토큰이 있으면 공식 쪽을 쓸 것.
  hf_id: "unsloth/Llama-3.2-1B"
  n_layers: 16
  n_heads: 32
  n_kv_heads: 8
  head_dim: 64             # = d. 부분 내적의 누산 폭
  kv_dtype_bytes: 2        # FP16 (외부 KV 캐시 크기 계산용)
  source: "huggingface_config"

# ---------------------------------------------------------------------------
# 디코드 루프 설정  ★ 이 프로젝트는 고정 스냅샷이 아니라 루프를 돈다 ★
#   step s 에서 쿼리 q_s 는 토큰 0..s-1 을 본다 (causal).
#   T 가 자라면서 평균 종단 시점이 어떻게 변하는지가 핵심 관찰 대상.
# ---------------------------------------------------------------------------
decode:
  # ★★ 2026-08-29: 512 -> 2048 ★★
  #   512 는 지는 구간이다. 손익분기가 T~730 이라 512 에서는 이득이 안 난다.
  #   그리고 늘리는 데 BRAM 이 하나도 안 든다 — BRAM36 32개는 대역폭 때문에
  #   잡은 것이지 용량 때문이 아니어서 512 에서는 22% 만 쓰고 놀고 있었다.
  #       N_MAX  비트평면 저장   이용률   BRAM 추가
  #         512      262,144b     22%       0
  #        2048    1,048,576b     89%       0     <- 채택
  #        4096    2,097,152b    178%      25
  #   함께 바뀌는 것: hardware.yaml 의 output.idx_bits 9 -> 11
  #   (log2(2048)=11. 안 고치면 output_stage 가 폭 초과를 예외로 막는다)
  seq_len: 2048            # 최종 캐시 길이 T_max
  warmup_tokens: 32        # prefill 로 이미 채워진 토큰 (여기부터 디코드 시작)
  step_stride: 1           # 1 = 모든 스텝 기록. 크게 하면 샘플링해서 빠르게.
  layer_idx: 8
  head_idx: 0

# 합성 데이터 (torch/transformers 없을 때) — 어텐션 sink 를 심어
# "소수 토큰이 softmax 를 지배한다"(가이드 4.1절)는 성질을 재현한다.
synthetic:
  enabled: true
  q_std: 1.0
  k_std: 1.0
  sink_frac: 0.04
  sink_gain: 3.5
  # 실제 어텐션 로짓의 표준편차 목표. 표준정규 q,k 를 그대로 쓰면 1 근처가 되어
  # softmax 가 거의 균등해지고 종단/근사 손실이 모두 비현실적으로 나온다.
  #
  # ★ 2026-08-28 실측으로 교체 ★
  #   예전 값 5.0 은 "실제 LLM 로짓 std 는 대략 3~8" 이라는 서술에 기댄 것이었는데,
  #   Llama 3.2 1B 를 직접 캡처해 재 보니 층·헤드에 따라 1.27 ~ 3.71 이었다
  #   (L8/H0 기준 1.95, 다양한 문장이면 2.50). 5.0 은 실제보다 뾰족하다.
  #   다만 종단 거동은 이 값에 둔감하다 — 합성 27.9% vs 실제 25.0~36.9% 로
  #   같은 구간에 있고, 실제 데이터가 오히려 더 유리하다.
  target_logit_std: 2.5
  source: "measured_llama32_1b_L8H0"
