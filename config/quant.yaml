# ===========================================================================
# 양자화 규약  — 배경지식 가이드 5.3절
#
# ★★ 이 파일의 규약이 5.4절 상한식의 전제다. 함부로 바꾸면 안 된다. ★★
#
#   K : 비대칭(asymmetric) unsigned 8비트.  K_stored ∈ [0, 255]
#       실제값 ≈ (K_stored - zero_point) * scale_k
#       -> 비트 자리값이 전부 양수(2^b)이므로
#          R_m = (2^(8-m) - 1) * Q+  가 8개 평면 전부에 그대로 적용된다.
#
#       ★ 정정 (2026-08) ★
#       "signed 로 저장하면 상한식이 깨진다"는 이전 주석은 틀렸다.
#       MSB-first 라 부호 비트는 라운드 0에 확정되어 '결정된 부분합'에 들어가고,
#       미확정 비트의 자리값은 전부 양수다. signed 에서도 유효한 bound 를 세울 수
#       있으며 PADE(HPCA 2026)/BitStopper 가 실제로 그렇게 한다.
#
#       ★ 단 평면 0 은 예외다 (2026-08-28 확인).
#         signed 는 m=0 에서 R_0 = -128*Q- + 127*Q+ 라는 별도 공식이 필요하고,
#         unsigned 공식(255*Q+)을 그대로 쓰면 Q+ < |Q-| 인 q 에서 깨진다.
#         m>=1 부터는 남은 자리값이 전부 양수라 같은 형태가 된다.
#
#       unsigned 의 이득은 '평면 0 예외를 없애 8개 평면에 단일 공식을 쓰는 것'이다.
#       회로 단순화이지 수학적 필연이 아니다.  -> docs/related_work.md
#
#   ★★ 상한식 성립 조건:  0 <= K_stored < 2^n_planes ★★
#       벗어나면 to_bitplanes 가 조용히 잘라 비트평면이 K 를 대표하지 못하고
#       상한식이 깨진다. to_bitplanes 가 입구에서 막는다. -> src/bounds.py
#
#   q : 대칭(symmetric) signed 8비트.  q ∈ [-127, 127]
#       Q+ = q 중 양수의 합,  Q- = q 중 음수의 합
#
#   zero-point 보정항 = -zero_point * sum(q)  ->  모든 토큰에 동일한 상수.
#       * 순위(top-k)에는 영향이 없다  -> 종단 판정에서는 무시 가능
#       * 최종 점수값에는 필요하다     -> accumulator.py 에서 한 번 더한다
# ===========================================================================

key:
  bits: 8
  scheme: "asymmetric_unsigned"
  granularity: "per_channel"   # KIVI[11]: K는 채널(=차원) 단위 양자화가 유리
  clip_percentile: 100.0       # 100 = min/max 그대로. 낮추면 이상치 클리핑.

query:
  bits: 8
  scheme: "symmetric_signed"
  granularity: "per_token"

# 비트평면 처리 순서 — MSB 우선 (가이드 4.2절)
planes:
  order: "msb_first"
  n_planes: 8

# ---------------------------------------------------------------------------
# 근사 모드 여유값 (MARGIN)   ★ 2026-08-29 밤: 0.7 -> 0.40 으로 되돌림 ★
#
#   종단 조건을 U_m < theta + MARGIN * (상한 폭) 으로 세게 잡는다.
#   ★★ MARGIN 은 R/W 레지스터(0x0C)다. 합성 상수가 아니라 런타임에 바꾼다. ★★
#   여기 값은 "증명 가능한 무손실" 기본값이고, 운영에서 올릴 수 있다.
#
# ── 경위 ─────────────────────────────────────────────────────────────────
#   0.5   T=512 합성 데이터, 층8/헤드0 하나로 정했던 값
#   0.7   실제 텐서 T=2048 로 재고 8조합(2텍스트x2층x2헤드)에서 무손실 확인
#   0.40  96조합(3텍스트x4층x8헤드)으로 넓히니 여기까지 내려갔다   <- 채택
#
#   표본을 넓힐수록 안전값이 계속 떨어졌다. "전역 안전값" 은 전 조합의
#   **최솟값** 이라 표본이 커지면 내려갈 수밖에 없다.
#       조합   8 -> 전역 0.70,  헤드별 이득  +2.9%p
#       조합  32 -> 전역 0.50,  헤드별 이득  +8.0%p
#       조합  96 -> 전역 0.40,  헤드별 이득 +11.1%p
#       조합 384 -> 전역 0.40,  헤드별 이득 +10.7%p   <- 32헤드 전부. 수렴했다
#
# ── 절감-보존 곡선 (exp9, 384조합, T=512, K_TOP=16) ──────────────────────
#     margin   절감 평균   절감 최소   보존 최악    실질
#       0.40     34.5%      25.1%    1.00000    완전 무손실     <- 채택
#       0.50     37.5%      27.9%    0.99987    10만개 중 13개
#       0.70     46.6%      36.7%    0.99505    1000개 중 5개
#       0.80     54.4%      46.2%    0.93398    여기서 무너진다
#
#   조합별 knee 는 0.40 ~ 0.80 이고 **중앙값은 0.70** 이다. 즉 0.7 은
#   대부분의 헤드에서 맞고, 이상치 몇 개가 전역값을 끌어내린다.
#
# ── 헤드별 MARGIN 테이블을 검토할 것 ─────────────────────────────────────
#   이득이 +10.7%p 다 (34.5% -> 45.2%). 그리고 **면적이 거의 안 든다** —
#   상태 기계가 (질의, 헤드) 하나씩 처리하므로(ARCHITECTURE 7절 LOAD_Q)
#   헤드별 margin 은 32엔트리 테이블(32 x 8b = 256b) 이고 비교기는 하나 그대로다.
#   진짜 비용은 면적이 아니라 **모델마다 헤드별 knee 를 측정해 채워야 하는 것**이다.
# ---------------------------------------------------------------------------
margin:
  value: 0.40
  mode: "relative_width"
  # 운영에서 올릴 수 있는 값. 논문에는 곡선 전체를 싣는다.
  aggressive: 0.70
  source: "measured_llama32_1b_384combos_exp9"
