# ===========================================================================
# 실험 스윕 정의 — experiments/*.py 가 읽는다.
# 여기만 고치면 실험 범위가 바뀌고 코드는 건드리지 않는다.
# ===========================================================================

repro:
  seeds: [0, 1, 2]
  data_seed: 0

# ---------------------------------------------------------------------------
# EXP1 — 종단 프로파일 (가이드 8.3 1단계의 핵심 질문)
#   "평균적으로 몇 개의 평면에서 종단되는가"
#   종단이 거의 안 일어나면 설계를 다시 검토해야 하므로 가장 먼저 돌린다.
# ---------------------------------------------------------------------------
exp1:
  designs: ["baseline", "seq", "exact", "approx"]
  # ★ K_TOP = 16 확정 (2026-08-28). perplexity 근거 — k=8 은 품질 대가 +11.9%,
  #   k=16 은 +5.8%. 절감은 3.4%p 만 내준다.  -> ARCHITECTURE.md §1
  top_k: [16]
  margin: [0.0, 0.40, 0.70]     # 0=정확, 0.40=무손실 기본, 0.70=운영
  theta_policy: ["every_plane"]

# ---------------------------------------------------------------------------
# EXP2 — ★ 최종 산출물: 그림 8.1 두 곡선 (여유값 vs 절감량/정확도손실)
# ---------------------------------------------------------------------------
#   margin 은 relative_gap 정규화를 쓴다 (src/threshold.py 참조).
#   0.0 = 정확 모드, 1.0 = θ 를 1등 하한까지 올림 (매우 공격적)
exp2:
  # ★ knee 가 0.8~1.0 사이에 있다 (0.8 무손실 -> 1.0 붕괴). 그 구간을 촘촘히.
  #   MARGIN 확정값은 0.5(무손실) / 0.7(최악 보존율 0.9990).
  # ★ 0.7~0.8 사이가 knee 다. 그 구간을 촘촘히 훑는다 (2026-08-29 상향에 맞춰)
  # ★ 한 줄로 둘 것 ★ 자체 파서(PyYAML 없을 때)는 여러 줄 리스트를 못 읽고
  #   뒷줄을 조용히 버린다. PyYAML 유무에 따라 스윕 범위가 달라진다.
  #   tests/test_config_dataset.py::test_mini_parser_matches_pyyaml_on_every_config_file
  margin: [0.0, 0.2, 0.4, 0.5, 0.6, 0.65, 0.7, 0.72, 0.74, 0.76, 0.78, 0.80, 0.82, 0.85, 0.90, 0.95, 1.0]
  # ★ 첫 원소가 그림 8.1 의 기준이 된다 (run_paper_experiments.py:87).
  #   확정값 16 을 맨 앞에 둔다.
  top_k: [16, 8, 32]
  theta_policy: ["every_plane"]

# ---------------------------------------------------------------------------
# EXP3 — θ 를 언제 확정할 것인가 (가이드 6.3-(3))
# ---------------------------------------------------------------------------
exp3:
  theta_policy: ["every_plane", "once_at_m", "prev_step", "oracle_fixed"]
  # ★ M0 = 4 확정. m=1,2 는 θ 가 너무 이르게 굳어 절감이 사실상 0 이고
  #   m=6 은 이미 읽은 양이 많아 떨어진다. 4 가 최대다 (실측).
  #   경계를 보기 위해 5~6 까지 함께 훑는다.
  once_at_m: [1, 2, 3, 4, 5, 6]
  top_k: [16]
  margin: [0.0, 0.40, 0.70]     # 0=정확, 0.40=무손실 기본, 0.70=운영

# ---------------------------------------------------------------------------
# EXP4 — 종단 시점 불규칙성 처리 (가이드 6.3-(2))
# ---------------------------------------------------------------------------
# ⚠ 아래 exp4 · exp6 은 팀 1 실험이다. K_TOP = 16 확정에 맞출지는 팀 1 이 정한다.
#   (지금 top_k: [8] 로 남아 있어 exp1~exp3 와 조건이 다르다)
exp4:
  schedule_policy: ["batch", "compaction", "two_phase"]
  batch_size: [8, 16, 32, 64]
  # 종단은 보통 평면 3~4 이전에는 거의 일어나지 않으므로,
  # split 이 그보다 작으면 결과가 같아진다. 큰 값까지 함께 훑는다.
  two_phase_split: [2, 3, 4, 5, 6]
  word_tokens: [1, 8, 16, 32, 64]     # ★ BRAM 워드폭이 실현 절감을 좌우
  top_k: [8]
  margin: [0.0, 0.40, 0.70]     # 0=정확, 0.40=무손실 기본, 0.70=운영

# ---------------------------------------------------------------------------
# EXP5 — 문장 길이 N 과 상위 k 스캔
# ---------------------------------------------------------------------------
exp5:
  seq_len: [128, 256, 512]
  top_k: [1, 2, 4, 8, 16, 32, 64]
  margin: [0.0, 0.40, 0.70]     # 0=정확, 0.40=무손실 기본, 0.70=운영
  theta_policy: ["every_plane"]

# ---------------------------------------------------------------------------
# EXP6 — 손익분기 (가이드 6.3-(4))
#   사이클 절감이 Fmax 저하와 자원 증가를 넘어서는 구간을 찾는다.
# ---------------------------------------------------------------------------
exp6:
  # ★ 위쪽도 쓸어야 한다 ★ 아래쪽만 보면 손익분기선을 한 번도 지나지 않아
  #   '결론이 얼마나 견고한가' 에 답할 수 없다. 1.0 초과 = 낙관 시나리오.
  fmax_derate_sweep: [1.15, 1.10, 1.05, 1.00, 0.95, 0.90, 0.85, 0.80, 0.75]
  seq_len: [128, 256, 512]
  top_k: [8]
  margin: [0.0, 0.40, 0.70]     # 0=정확, 0.40=무손실 기본, 0.70=운영

# ---------------------------------------------------------------------------
# EXP7 — ★ 병목 위치가 종단의 가치를 정한다 (2026-08-29 신설, 팀 2)
#
#   total = max(compute, memory),   memory = ceil(words_bram / n_ports)
#
#   조기 종단이 줄이는 것은 메모리다. max() 가 연산을 집으면 그 절감이
#   시간으로 환산되지 않는다. 병목이 넘어가는 포트 수를 찾는다.
#
#   n_bram_ports 를 2 -> 32 로 고치면서 병목이 연산으로 넘어가
#   종단의 시간 이득이 1.00 이 된 것이 이 실험의 계기다.
# ---------------------------------------------------------------------------
exp7:
  # ★ 채택값 32 를 사이에 두고 양쪽을 훑는다. 한쪽만 보면 교차점을 못 찾는다.
  n_bram_ports_sweep: [2, 4, 8, 16, 24, 32, 64]
  # ★ N_MAX=2048 확정에 맞춰 2048 까지. 손익분기가 T~1280 이라 그 위를 봐야 한다.
  seq_len: [512, 1024, 2048]
  top_k: [16]
  margin: [0.0, 0.40, 0.70]     # 0=정확, 0.40=무손실 기본, 0.70=운영
